[package]
name = "hodl_hook"
version = "0.1.0"
description = "Transfer hook for HODL tokens: until a token graduates it can only move by buying or selling on its curve"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "hodl_hook"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "1.1.2"
